<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fetch</title>
    <style>
        body {
            font-family: Arial, sans-serif;
        }

        h1 {
            text-align: center;
        }

        button {
            display: block;
            margin: 20px auto;
            padding: 10px 20px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
        }
        div {
            text-align: center;
            font-size: 20px;
            border: 5px;
            border-style: solid;
            border-color: #4CAF50;
            padding: 20px;
        }
        
    </style>

</head>

<body>
    <h1>Random Joke</h1>
    <div></div>
    <button id="button">Click For New Joke</button>
    <script>
        document.getElementById('button').addEventListener('click', getJoke);

        function getJoke() {
            fetch('https://api.chucknorris.io/jokes/random')
                .then(response => response.json())
                .then(data => {
                    document.querySelector('div').innerHTML = data.value;
                })
        }
    </script>

</body>

</html>
