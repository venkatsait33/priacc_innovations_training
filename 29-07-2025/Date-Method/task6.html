<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script>
      const currentDate = new Date();
      console.log("ISO Format:", currentDate.toISOString());
      console.log("UTC Format:", currentDate.toUTCString());
    </script>
  </head>
  <body>
    <h1>Convert date to ISO and UTC formats</h1>
  </body>
</html>
