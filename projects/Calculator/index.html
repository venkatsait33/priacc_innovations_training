<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Calculator</title>
    <style>
        .btn {
            @apply bg-gray-300 hover:bg-gray-400 rounded-xl p-4 text-xl font-semibold text-gray-800 transition;
        }
    </style>
</head>

<body class="bg-gray-100 flex items-center justify-center h-screen">

    <div class="bg-white p-6 rounded-2xl shadow-xl w-72">
        <h1 class="text-2xl font-bold text-center mb-4 text-gray-800">Calculator</h1>

        <!-- Display -->
        <div id="display"
            class="bg-gray-200 h-16 mb-4 rounded-lg flex items-center justify-end px-4 text-2xl font-mono text-gray-900 overflow-x-auto">
            0
        </div>

        <!-- Buttons Grid -->
        <div class="grid grid-cols-4 gap-3">
            <!-- Row 1 -->
            <button class="btn" data-value="7">7</button>
            <button class="btn" data-value="8">8</button>
            <button class="btn" data-value="9">9</button>
            <button class="btn bg-orange-500 text-white" data-value="/">÷</button>

            <!-- Row 2 -->
            <button class="btn" data-value="4">4</button>
            <button class="btn" data-value="5">5</button>
            <button class="btn" data-value="6">6</button>
            <button class="btn bg-orange-500 text-white" data-value="*">×</button>

            <!-- Row 3 -->
            <button class="btn" data-value="1">1</button>
            <button class="btn" data-value="2">2</button>
            <button class="btn" data-value="3">3</button>
            <button class="btn bg-orange-500 text-white" data-value="-">−</button>

            <!-- Row 4 -->
            <button class="btn" data-value="0">0</button>
            <button class="btn" data-value=".">.</button>
            <button class="btn bg-red-500 text-white" id="clear">C</button>
            <button class="btn bg-orange-500 text-white" data-value="+">+</button>

            <!-- Row 5 -->
            <button class="col-span-4 btn bg-green-500 text-white" id="equals">=</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
