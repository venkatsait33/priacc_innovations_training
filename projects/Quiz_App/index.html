<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quiz App</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 flex items-center justify-center min-h-screen">

    <div class="bg-white p-6 rounded-2xl shadow-xl w-full max-w-md">
        <h1 class="text-2xl font-bold text-center mb-6 text-gray-800">Quiz App</h1>
        <div id="quiz-container">
            <h2 id="question" class="text-xl font-semibold mb-4 text-gray-700">Question text</h2>
            <div id="answers" class="flex flex-col space-y-3"></div>

            <button id="next-btn"
                class="hidden mt-6 w-full bg-blue-500 hover:bg-blue-600 text-white font-semibold py-2 px-4 rounded-xl transition">
                Next
            </button>
        </div>
        <div id="score-container" class="hidden text-center">
            <h2 class="text-2xl font-bold mb-4 text-gray-800">Your Score</h2>
            <p id="score" class="text-lg mb-6 text-gray-700"></p>
            <button id="restart-btn"
                class="bg-green-500 hover:bg-green-600 text-white font-semibold py-2 px-4 rounded-xl transition">
                Restart Quiz
            </button>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
