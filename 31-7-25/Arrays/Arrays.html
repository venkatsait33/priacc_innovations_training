<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h1>Arrays</h1>
    <script>
        let fruits = ["apple", "banana", "cherry"];

        let numbers = new Array(1, 2, 3, 4);
        //length – Returns the number of elements:
        let colors = ["red", "green", "blue"];
        console.log(colors.length); // Output: 3

        //forEach()
        //Loop through each element:
        fruits.forEach(function (item) {
            console.log(item);
        });
        //             map()
        // Transform array into a new one:

        let upper = fruits.map(function (item) {
            return item.toUpperCase();
        });
        console.log(upper);
        //             filter()
        // Filter elements that pass a test:

        let shortNames = fruits.filter(function (item) {
            return item.length <= 5;
        });
        console.log(shortNames);
        //             reduce()
        // Reduce array to a single value:

        let sum = numbers.reduce(function (total, num) {
            return total + num;
        });
        console.log(sum);
        //             find()
        // Find the first element matching a condition:

        let result = numbers.find(function (item) {
            return item > 2;
        });
        console.log(result);
        //             some()
        // Check if some elements match condition:

        numbers.some(function (num) {
            return num > 3;
        });
        
        //             every()
        // Check if all elements match condition:

        numbers.every(function (num) {
            return num > 0;
        });
    </script>
</body>

</html>
