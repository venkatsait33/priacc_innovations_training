<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script>
      const customDate = new Date();
      customDate.setFullYear(2030);
      customDate.setMonth(0); // January
      customDate.setDate(1);
      customDate.setHours(10);
      customDate.setMinutes(30);
      console.log("Custom Date and Time:", customDate.toString());
    </script>
  </head>
  <body>
    <h1>Set a custom date and time</h1>
  </body>
</html>
