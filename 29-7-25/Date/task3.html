<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script>
      const birthDay = new Date("2025-07-29");
      console.log("Birthday Year:", birthDay.getFullYear());
      console.log("birthDay Month (0-11):", birthDay.getMonth());
      console.log("birthDay Date:", birthDay.getDate());
    </script>
  </head>
  <body>
    <h1>Create a birthday date</h1>
  </body>
</html>
